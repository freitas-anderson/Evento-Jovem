<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin - Pastelada</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', sans-serif;
    }
    .navbar {
      background-color: #a200ff;
    }
    .navbar-brand {
      color: white;
      font-weight: bold;
    }
    .navbar-brand:hover {
      color: #ffffffcc;
    }
    .container {
      margin-top: 30px;
      padding-left: 15px;
      padding-right: 15px;
    }
    .table thead {
      background-color: #a200ff;
      color: white;
    }
    .logout-btn {
      background-color: #000000;
      color: white;
    }
    .logout-btn:hover {
      background-color: #c82333;
    }
    .card {
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      border-radius: 12px;
    }
    h2 {
      margin-bottom: 20px;
      font-weight: bold;
      font-size: 1.5rem;
    }
    @media (max-width: 576px) {
      .navbar-brand {
        font-size: 1rem;
      }
      .logout-btn {
        padding: 0.3rem 0.6rem;
        font-size: 0.85rem;
      }
      h2 {
        font-size: 1.25rem;
      }
      .table th, .table td {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid d-flex justify-content-between align-items-center px-3">
      <span class="navbar-brand">Painel de Pedidos</span>
      <a href="/logout" class="btn logout-btn">Sair</a>
    </div>
  </nav>

  <div class="container">
    <div class="card p-3">
      <h2 class="text-center">Pedidos Registrados</h2>
      <div class="table-responsive">
        <table class="table table-striped table-bordered">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Telefone</th>
              <th>Carne</th>
              <th>Frango</th>
              <th>Brócolis</th>
              <th>Total (R$)</th>
              <th>Data/Hora</th>
            </tr>
          </thead>
          <tbody>
            {% for p in pedidos %}
            <tr>
              <td>{{ p[0] }}</td>
              <td>{{ p[1] }}</td>
              <td>{{ p[2] }}</td>
              <td>{{ p[3] }}</td>
              <td>{{ p[4] }}</td>
              <td>{{ '{:.2f}'.format(p[5]) }}</td>
              <td>{{ p[6] }}</td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</body>
</html>
